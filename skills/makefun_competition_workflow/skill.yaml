  rationale: 'Three strict-recording attempts failed at seal in the 2026-11-16 window through three named mechanisms the current makefun_competition_workflow skill does not cover (it only says to build the transcript bundle with the flags the current kit requires). ai-excited-01 v1 was rejected for a parent session that started before the recording (assistant-msg-7701c84b-0be1-a4d0-4937-a519edf7ecda), and a symlink workaround failed because the recorder did not follow it (assistant-msg-5d7170d7-a87d-41f6-8dc3-f18fbd282bc2). The v3 build recording died when the main chat wrote twice inside the window and its large log was rewritten while recording (assistant-msg-da90cefb-59e8-0539-ec55-1b5dab0d8ae2). The v3 rebuild recording was held when a main-chat question inside the window and the parent reading the rebuild-brief file from disk pulled extra sessions in (assistant-msg-8908560c-fabb-7e05-1c62-d814f8d85780). The update adds one recording section to the managed skill that encodes the derived hard rules (new chat with recording first, main chat totally quiet, brief from memory only, fresh code in a fresh repo, explicit usage file at seal) while preserving every existing instruction, and extends the measurement contract to those three kill causes. No other finding in the window warranted a change: cron runs all succeeded, XE outcomes match the existing gate and sealed-ticket handling, tool failures carry no per-call detail naming a missing instruction, and the objective-loop rollups are outside skill scope.'
