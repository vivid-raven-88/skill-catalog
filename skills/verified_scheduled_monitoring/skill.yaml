  measurement:
    proxy_metric_id: objective_success_rate
    success_criterion: In post-install evidence, no covered reminder, scan, or watchdog is claimed active without a live-list check, and no stopped job goes unreported beyond one check interval. A repeat of an unverified-active claim or a silent gap like the 09:00 reminder and watchdog cases fails the change.
