name: "ecc-verification-loop"
title: "ECC Verification Loop"
description: "Run a six-phase verification of a session's work — build, type check, lint, tests with coverage, security grep, and diff review — then produce a PASS/FAIL verification report. Use when verifying work after completing a feature or refactor, before creating a PR, or when quality gates must pass. Adapted from affaan-m/ecc v2.2.3 (MIT)."
category: "Work and knowledge"
